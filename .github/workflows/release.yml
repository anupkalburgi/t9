name: Release

# Push a tag like v0.1.1 to build binaries and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p t9
      - name: Package
        shell: bash
        run: |
          dir="t9-${{ matrix.target }}"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/t9" "$dir/"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          tar -czf "$dir.tar.gz" -C "$dir" .
      - uses: actions/upload-artifact@v4
        with:
          name: t9-${{ matrix.target }}
          path: t9-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## "v"$" {p=1; next} /^## / {p=0} p' CHANGELOG.md)
          printf '%s\n\nInstall:\n\n    curl -fsSL https://raw.githubusercontent.com/%s/main/install.sh | sh\n' \
            "$notes" "$GITHUB_REPOSITORY" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* install.sh --title "t9 ${GITHUB_REF_NAME}" --notes-file notes.md
